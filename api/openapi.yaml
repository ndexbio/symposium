        handle:
          $ref: '#/components/schemas/Handle'
        public_jwk:
          $ref: '#/components/schemas/PublicJwk'
        nonce:
          type: string
        signature:
          type: string
          description: The nonce's signature by the key being registered, its proof of possession.
        invite:
          type: string
          description: The invite, `sdi_…`.
    Registered:
      type: object
      required: [handle, community, kid, roles]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        community:
          type: string
          nullable: true
          description: The user's home community; null for a server-level user.
        kid:
          type: string
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AssignedRole'
    RotateIn:
      type: object
      required: [public_jwk, nonce, signature]
