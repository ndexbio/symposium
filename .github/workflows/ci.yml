name: ci

# Every branch push and every pull request, whatever branch it targets; release tags run
# release.yml instead
on:
  push:
    branches: ["**"]
  pull_request:

# One run per branch: a push and the pull request it updates share this group, as do
# successive pushes, so a newer run cancels the one still in progress
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    # Linux runs the whole gate, the data server's suites and their one image build included;
    # Windows runs the skill's runtime and session suites, which need no container
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, docker: true}
          - {os: windows-latest, docker: false}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make test DOCKER=${{ matrix.docker }}
        shell: bash
