# Symposium Data: Kubernetes / Podman deployment.
#
#   kubectl apply -f k8s-data-deployment.yml        (or: podman play kube k8s-data-deployment.yml)
#
# All state (PostgreSQL, SeaweedFS, service secrets) lives under /apps on one ReadWriteOnce
# PVC, so the Deployment runs one replica with the Recreate strategy. The server starts
# uninitialized; bind the admin with:
#   kubectl exec -i deploy/symposium-data -- data-admin init --admin <handle> --pubkey - < admin.pub.jwk
#
# Pin the image to a released version (ndexbio/symposium-data:<version>) for production.
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: symposium-data-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi          # size to the community's data; edit before applying
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: symposium-data
  labels: {app: symposium-data}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: symposium-data}
  template:
    metadata:
      labels: {app: symposium-data}
    spec:
      initContainers:
        - name: symposium-data-init
          image: docker.io/ndexbio/symposium-data
          imagePullPolicy: Always
          command: ["sh", "-c"]
          args:
            - >-
              mkdir -p /apps/data/config /apps/postgres/config /apps/postgres/data
              /apps/seaweed/config /apps/seaweed/data &&
              chown -R symposium:symposium /apps/data /apps/seaweed &&
              chown postgres:postgres /apps/postgres/config /apps/postgres/data
          volumeMounts:
            - {name: symposium-data-storage, mountPath: /apps}
      containers:
        - name: symposium-data
          image: docker.io/ndexbio/symposium-data
          imagePullPolicy: Always
          args: ["--data-api", "--postgres", "--seaweed"]
          env:
            - {name: SYMPOSIUM_DATA_TRUSTED_PROXY, value: "10.0.0.0/8"}
          ports:
            - {name: http, containerPort: 8080, protocol: TCP}
          readinessProbe:
            httpGet: {path: /v1/status, port: 8080}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 6
          volumeMounts:
            - {name: symposium-data-storage, mountPath: /apps}
      volumes:
        - name: symposium-data-storage
          persistentVolumeClaim: {claimName: symposium-data-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: symposium-data
  labels: {app: symposium-data}
spec:
  type: ClusterIP
  selector: {app: symposium-data}
  ports:
    - {name: http, port: 8080, targetPort: 8080, protocol: TCP}
---
# Example Ingress with TLS. Only the API port is ever exposed; SeaweedFS and PostgreSQL stay
# inside the pod.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: symposium-data
spec:
  tls:
    - hosts: [data.example.org]
      secretName: symposium-data-tls
  rules:
    - host: data.example.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: symposium-data
                port: {number: 8080}
