
[program:api-server]
command=/opt/venv/bin/uvicorn symposium_server:app --host 0.0.0.0 --port 8080 --workers %(ENV_SYMPOSIUM_SERVER_WORKERS)s --proxy-headers --forwarded-allow-ips %(ENV_SYMPOSIUM_SERVER_TRUSTED_PROXY)s
user=symposium
priority=30
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
