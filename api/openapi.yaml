        specification_versions:
          type: array
          items:
            type: string
    ArtifactSummary:
      type: object
      description: One Artifact's header fields and counts, as a listing carries it.
      required: [name, address, url, type, published_by, created]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        address:
          $ref: '#/components/schemas/Address'
        url:
          type: string
          format: uri
        type:
          type: string
        title:
          type: string
        published_by:
          $ref: '#/components/schemas/Handle'
        created:
          type: string
          format: date-time
        groundable:
          type: boolean
          description: False for a non-groundable type or a header saying so.
        supersedes:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        superseded_by:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        counts:
          type: object
          properties:
            objects:
              type: integer
            grounds:
              type: integer
            tests:
              type: integer
              description: Grounds carrying a `criterion`.
            findings:
              type: integer
    ArtifactSummaryPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ArtifactSummary'
    ArtifactResource:
      type: object
      required: [url, address, position, links, canonical]
      properties:
        url:
          type: string
          format: uri
        address:
          $ref: '#/components/schemas/Address'
        position:
          $ref: '#/components/schemas/Position'
        links:
          type: object
          required: [member, supersedes, superseded_by, cited_by, findings]
          properties:
            member:
              type: string
              format: uri
            supersedes:
              type: array
              items:
                type: string
                format: uri
            superseded_by:
              type: array
              items:
                type: string
                format: uri
            produced_by:
              type: string
              format: uri
            cited_by:
              type: string
              format: uri
            findings:
              type: string
              format: uri
            content:
              type: string
              format: uri
              description: The Artifact's stored canonical JSON, from `getArtifactContent`.
        canonical:
          $ref: '#/components/schemas/CanonicalArtifact'
    PropertyResource:
      type: object
      required: [url, address, property, value, position]
      properties:
        url:
          type: string
          format: uri
        address:
          $ref: '#/components/schemas/Address'
        property:
          type: string
        value:
          $ref: '#/components/schemas/PropertyValue'
        position:
          $ref: '#/components/schemas/Position'
    ObjectEntry:
      type: object
      required: [url, address, object]
      properties:
        url:
          type: string
          format: uri
        address:
          $ref: '#/components/schemas/Address'
        object:
          $ref: '#/components/schemas/RecordObject'
    ObjectPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ObjectEntry'
    ObjectResource:
      type: object
      required: [url, address, artifact_url, object, position, relationships_url]
      properties:
        url:
          type: string
          format: uri
        address:
          $ref: '#/components/schemas/Address'
        artifact_url:
          type: string
          format: uri
        object:
          $ref: '#/components/schemas/RecordObject'
        relationships_url:
          type: string
          format: uri
          description: The Artifact's relationships, narrowed to those touching this Object.
        location_url:
          type: string
          format: uri
          description: |
            Where a `symposium-data:<file id>@v<n>` location is read on this API: the file
            version's content (`getFileContent`), which its collection's access governs.
        position:
          $ref: '#/components/schemas/Position'
    RelationshipPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Relationship'
    CitationVia:
      type: string
      description: How a later Artifact cites this one.
      enum:
        - ground
        - testimony
        - produced_by
        - inputs
        - supersedes
        - extracted_from
        - serves_goals
        - recipients
        - prose
    Citation:
      type: object
      description: One citation of this Artifact or its content by a later Artifact.
      required: [via, address, from, from_url, from_type, from_created]
      properties:
        via:
          $ref: '#/components/schemas/CitationVia'
        address:
          $ref: '#/components/schemas/Address'
        from:
          $ref: '#/components/schemas/Address'
        from_url:
          type: string
          format: uri
        from_type:
          type: string
        from_created:
          type: string
          format: date-time
        ground:
          description: For `ground` and `testimony`, the citing Ground's address.
          allOf:
            - $ref: '#/components/schemas/Address'
    CitationPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Citation'
    SupersessionEntry:
      type: object
      required: [address, url, created, direction, distance]
      properties:
        address:
          $ref: '#/components/schemas/Address'
        url:
          type: string
          format: uri
        created:
          type: string
          format: date-time
        direction:
          type: string
          enum: [earlier, later]
        distance:
          type: integer
          minimum: 1
        supersedes_rationale:
          type: string
    SupersessionPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SupersessionEntry'
    FindingLevel:
      type: string
      enum: [FAIL, REVIEW]
    Finding:
      type: object
      description: One finding of the validator, as `tools/validate.py` writes it.
      required: [check, level, msg]
      properties:
        check:
          type: string
          description: STRUCT, TYPE, ADDRESS, GROUND, CITATION, GOAL, INDEPENDENCE, NAMING, ORDER, SIZE, SUPERSEDED, UNIQUE.
        level:
          $ref: '#/components/schemas/FindingLevel'
        msg:
          type: string
        object:
          description: The Object the finding names, where it names one.
          allOf:
            - $ref: '#/components/schemas/Name'
    FindingPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items, basis]
          properties:
            basis:
              type: string
              enum: [accepted, current]
            items:
              type: array
              items:
                $ref: '#/components/schemas/Finding'
    Resolution:
      type: object
      required: [address, kind, url, position]
      properties:
        address:
          $ref: '#/components/schemas/Address'
        kind:
          type: string
          enum: [member, artifact, object, property, object_property]
        url:
          type: string
          format: uri
        artifact:
          $ref: '#/components/schemas/Name'
        object:
          $ref: '#/components/schemas/Name'
        property:
          type: string
        node_type:
          type: string
          description: The type of the Artifact or Object named.
        method:
          type: string
          description: The Content Object a schema reference reaches through.
        ref:
          type: string
          description: The reference string after the Content Object's name.
        verified:
          type: boolean
          description: True when the server checked the reference against embedded content.
        value:
          description: The value reached, where the address reaches one.
          allOf:
            - $ref: '#/components/schemas/PropertyValue'
        location:
          type: string
          description: |
            For a Content Object, or an address through one, the Object's `location`.
        access_method:
          type: string
          description: |
            For a Content Object, or an address through one, the Object's `access_method`.
        location_url:
          type: string
          format: uri
          description: |
            Where a `symposium-data:<file id>@v<n>` location is read on this API: the file
            version's content (`getFileContent`), which its collection's access governs.
        position:
          $ref: '#/components/schemas/Position'
    MemberResource:
      type: object
      required: [handle, address, url, registered, counts, position]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        address:
          $ref: '#/components/schemas/Address'
        url:
          type: string
          format: uri
        registered:
          type: boolean
          description: True once the Member has joined from its invite.
        removed:
          type: string
          nullable: true
          format: date-time
          description: When the Member was removed; its record stays under its handle.
        counts:
          type: object
          properties:
            artifacts:
              type: integer
            by_type:
              type: object
              additionalProperties:
                type: integer
        artifacts_url:
          type: string
          format: uri
        messages_url:
          type: string
          format: uri
        position:
          $ref: '#/components/schemas/Position'
    MemberPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MemberResource'
    KeyKind:
      type: string
      description: A session key from sign-in, or an issued key.
      enum: [session, issued]
    Me:
      type: object
      required: [kind, handle, label, community, key_id, roles, context, position]
      properties:
        kind:
          $ref: '#/components/schemas/KeyKind'
        handle:
          type: string
          nullable: true
          description: The user the key acts as; null for a non-member key.
        label:
          type: string
          nullable: true
          description: The name the key's issuer gave it; null for a session key.
        community:
          $ref: '#/components/schemas/CommunityName'
        key_id:
          type: string
          format: uuid
        kid:
          type: string
          nullable: true
          description: |
            For a session key, the thumbprint of the public key whose private key file obtained
            it; null for an issued key.
        expires:
          type: string
          nullable: true
          format: date-time
        suspect_after:
          type: string
          nullable: true
          format: date-time
          description: |
            When the key's user was flagged: what it writes after this instant reads
            `"suspect": true`. Null when unflagged, and for a non-member key.
        roles:
          type: array
          description: The roles the key acts with (its user's for a session key, its own for an issued key).
          items:
            $ref: '#/components/schemas/AssignedRole'
        context:
          $ref: '#/components/schemas/UserContext'
        member_url:
          type: string
          format: uri
          description: The member this key acts as, when it acts as a user of this community.
        position:
          $ref: '#/components/schemas/Position'
    SubmissionCheck:
      type: object
      required: [ok, findings, position]
      properties:
        ok:
          type: boolean
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        position:
          $ref: '#/components/schemas/Position'
    SubmissionStatus:
      type: string
      description: |
        `pending` until the gate decides. `skipped` when the gate's own rule sets it aside: its
        inbox name is the artifact's name with the wrong prefix, or its submitter is not an
        active member. Then `accepted` or `rejected`. `api/DESIGN.md` §6 says where each comes from.
      enum: [pending, skipped, accepted, rejected]
    SubmissionResource:
      type: object
      required: [id, url, name, submitted_by, submitted, status, citation, position]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        name:
          $ref: '#/components/schemas/Name'
        type:
          type: string
        submitted_by:
          $ref: '#/components/schemas/Handle'
        submitted:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        citation:
          type: string
          description: The submission's file version on the data server, `symposium-data:<uuid>@v1`.
        decided:
          type: string
          nullable: true
          format: date-time
        artifact_url:
          type: string
          format: uri
          description: Accepted. The record Artifact.
        reply:
          description: Rejected. The gate's reply.
          allOf:
            - $ref: '#/components/schemas/Reply'
        position:
          $ref: '#/components/schemas/Position'
    SubmissionPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SubmissionResource'
    Reply:
      type: object
      description: The gate's reply to a rejected submission, as it sits in `inbox`.
      required: [sender, sent, text, failures]
      properties:
        sender:
          $ref: '#/components/schemas/Handle'
        sent:
          type: string
          format: date-time
        text:
          type: string
          description: The reply as the gate wrote it, `REJECTED` and one line per failure.
        failures:
          type: array
          description: One line per failure the validator found.
          items:
            type: string
    StreamEventBase:
      type: object
      description: One Server-Sent Events frame. `id` is a cursor for `Last-Event-ID`.
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/Cursor'
        event:
          type: string
        data:
          type: object
    HeartbeatEvent:
      allOf:
        - $ref: '#/components/schemas/StreamEventBase'
        - type: object
          properties:
            event:
              enum: [heartbeat]
            data:
              type: object
              required: [position]
              properties:
                position:
                  $ref: '#/components/schemas/Position'
    RecordStreamEvent:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/StreamEventBase'
            - type: object
              properties:
                event:
                  enum: [artifact]
                data:
                  $ref: '#/components/schemas/ArtifactSummary'
        - $ref: '#/components/schemas/HeartbeatEvent'
    SubmissionStreamEvent:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/StreamEventBase'
            - type: object
              properties:
                event:
                  enum:
                    - submission.received
                    - submission.accepted
                    - submission.rejected
                    - submission.skipped
                data:
                  $ref: '#/components/schemas/SubmissionResource'
        - $ref: '#/components/schemas/HeartbeatEvent'
    ServerStatus:
      type: object
      required: [api, version, server_id, mode, postgres, s3]
      properties:
        api:
          type: string
          description: The API's major version.
        version:
          type: string
          description: The server's release.
        server_id:
          type: string
        mode:
          type: string
          enum: [operational, non-operational]
        postgres:
          type: string
          enum: [ok, unavailable]
        s3:
          type: string
          enum: [ok, unavailable]
        root:
          type: string
          description: The root user's handle, bound from the key file, once operational.
        fingerprint:
          type: string
          description: The root key's RFC 7638 thumbprint, once operational.
        public_url:
          type: string
          description: The server's public URL, when one is configured.
        reason:
          type: string
          description: Why the server is non-operational.
        api_index:
          type: object
          required: [behind]
          properties:
            behind:
              type: integer
              description: Record versions the index has yet to fold in, across every community.
    Challenge:
      type: object
      required: [nonce, expires_in]
      properties:
        nonce:
          type: string
        expires_in:
          type: integer
          description: Seconds until the nonce expires.
    ChallengeIn:
      type: object
      required: [handle]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        community:
          type: string
          nullable: true
          description: The user's home community; null or omitted for a server-level user.
    SessionRequest:
      type: object
      required: [handle, nonce, signature]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        community:
          type: string
          nullable: true
          description: The user's home community; null or omitted for a server-level user.
        nonce:
          type: string
        signature:
          type: string
          description: The nonce's Ed25519 signature, base64url.
    Session:
      type: object
