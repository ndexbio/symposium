          type: string
          format: uuid
        community:
          $ref: '#/components/schemas/CommunityName'
        requested_by:
          type: string
        source:
          type: string
        state:
          type: string
          enum: [running, ok, failed]
        result:
          type: object
          nullable: true
        started:
          type: string
          format: date-time
        finished:
          type: string
          nullable: true
          format: date-time
    RosterEntry:
      type: object
      required: [handle, registered, removed, roles]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        registered:
          type: boolean
        removed:
          type: string
          nullable: true
          format: date-time
