        public_jwk:
          $ref: '#/components/schemas/PublicJwk'
        nonce:
          type: string
        signature:
          type: string
          description: The nonce's signature by the new key.
    Rotated:
      type: object
      required: [handle, kid]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        kid:
          type: string
    CommunityIn:
      type: object
      required: [name, admin]
      properties:
        name:
          type: string
        admin:
          $ref: '#/components/schemas/Handle'
    CommunityCreated:
      type: object
      required: [name, created]
      properties:
        name:
          type: string
        created:
          type: boolean
          description: False when exactly this name already existed.
