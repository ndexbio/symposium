[project]
name = "symposium-data"
version = "0.1.0"
description = "Symposium Data: versioned file storage and sharing for Symposium communities"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "boto3>=1.34",
  "cryptography>=42",
  "fastapi>=0.115",
  "psycopg[binary]>=3.2",
  "psycopg-pool>=3.2",
  "PyJWT>=2.8",
  "sqlalchemy>=2.0",
  "uvicorn>=0.30",
]

[dependency-groups]
dev = ["httpx>=0.27", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["symposium_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
