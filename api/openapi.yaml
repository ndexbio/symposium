          description: The revoked key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKey'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: sak_<43 base64url characters>
      description: |
        An API key the admin issued, sent as `Authorization: Bearer sak_…`. The `sak_` prefix
        tells it apart from the data server's Ed25519 tokens (JWTs) and read keys (`sdr_…`),
        which share the same header. The server matches a key by its SHA-256 digest; it
        decrypts nothing to authenticate.
    adminToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        The server admin's Ed25519 token from `POST /v1/admin/token`, the one the skill already
        holds. The gate operations accept it beside an `admin` API key. The API-key operations
        accept it alone, so an API key, whatever its scope, reads and makes no other key.
  parameters:
    community:
      name: community
      in: path
      required: true
      description: The community's name, matched ignoring case.
      schema:
        $ref: '#/components/schemas/CommunityName'
    artifactName:
      name: name
      in: path
      required: true
      description: The Artifact's `name`.
      schema:
        $ref: '#/components/schemas/Name'
    objectName:
      name: object
      in: path
      required: true
      description: The Object's `name` within its Artifact.
      schema:
        $ref: '#/components/schemas/Name'
    property:
      name: property
      in: path
      required: true
      description: The property's name.
      schema:
        $ref: '#/components/schemas/Name'
    handle:
      name: handle
      in: path
      required: true
      description: The Member's handle, its `name` without the `@`.
      schema:
        $ref: '#/components/schemas/Handle'
    submission:
      name: submission
      in: path
      required: true
      description: The submission's id, the id of its file in `inbox`.
      schema:
        type: string
        format: uuid
    keyId:
      name: key_id
      in: path
      required: true
      description: The API key's id.
      schema:
        type: string
        format: uuid
    cursor:
      name: cursor
      in: query
      description: The `next` of the previous page. Absent for the first page.
      schema:
        $ref: '#/components/schemas/Cursor'
    limit:
      name: limit
      in: query
      description: The most items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    order:
      name: order
      in: query
      description: '`created` for oldest first, `-created` for newest first.'
      schema:
        type: string
        enum: [created, -created]
        default: created
    publishRole:
      name: role
      in: query
      description: |
        The publishing role whose limit applies, as `--role` gives it. Absent means `operator`
        for an admin key and no type limit for a member key, as `/symposium publish` does;
        `none` applies no limit. The server looks the name up in the charters it ships
        (`listPublishRoles`) and answers 400 for any other name; it reads no path from it.
      schema:
        type: string
        pattern: ^[a-z][a-z0-9_-]{0,39}$
    lastEventId:
      name: Last-Event-ID
      in: header
      description: The `id` of the last event the client received. The stream resumes after it.
      schema:
        $ref: '#/components/schemas/Cursor'
  requestBodies:
    Submission:
      required: true
      description: One Artifact in canonical JSON, with `created` null.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubmittedArtifact'
  responses:
    BadRequest:
      description: A parameter or the body is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: The credential is absent, unknown, expired or revoked.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: The credential is valid and its roles or scope do not allow this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The community or the resource is unknown.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        The request conflicts with the state: a name already in the record or already
        submitted, or a gate operation already running.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotAnArgument:
      description: The view applies only to an Argument.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: The body is over 8 MiB, or over the Member's quota.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyStreams:
      description: |
        A stream cap is reached: 8 per API key, 4 per anonymous client address, 200
        anonymous in all, or the server's `SYMPOSIUM_API_MAX_STREAMS` (default 500), whose
        last 20 slots open only to an `admin` key. `api/DESIGN.md` §11.5 holds the rules.
        Close a stream or retry later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: The validator failed the Artifact. `findings` lists every finding.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: The body is well formed and its values break a rule, which `detail` names.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: |
        The one error body. `detail` is a sentence for a person, as the data server's `/v1`
        writes it; `code` is stable for a program.
      required: [detail, code]
      properties:
        detail:
          type: string
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - not_an_argument
            - too_large
            - validation_failed
            - unprocessable
            - not_operational
            - too_many_streams
        findings:
          type: array
          description: The validator's findings, on `validation_failed` only.
          items:
            $ref: '#/components/schemas/Finding'
    CommunityName:
      type: string
      pattern: ^[A-Za-z0-9_]{1,20}$
    Handle:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$
    Name:
      type: string
      description: A name in the specification's sense. It holds no `.` or `#` and starts with no `@`.
      pattern: ^[^@.#][^.#]*$
    Address:
      type: string
      description: |
        An address (specification §1.8): `@` and dot-separated segments naming a Member, an
        Artifact, an Object or a property, then optionally `#` and a schema reference.
      pattern: ^@[^.#]+
      examples:
        - '@agent_lyra_data_overexpression_screen_v1.values#csv.row=BST2&col=Normalized infection'
    Cursor:
      type: string
      maxLength: 256
      pattern: ^[A-Za-z0-9_-]+$
      description: |
        An opaque position in an ordered listing, base64url. It stays valid for the life of the
        record.
    Position:
      type: object
      description: The state of the record a read response reflects.
      required: [cursor, seq, created, as_of]
      properties:
        cursor:
          $ref: '#/components/schemas/Cursor'
        seq:
          type: integer
          minimum: 0
          description: The `record` collection's sequence number at the newest Artifact reflected.
        created:
          type: [string, 'null']
          format: date-time
          description: The `created` of the newest Artifact reflected; null for an empty record.
        as_of:
          type: string
          format: date-time
          description: When the server read the record for this response.
    PropertyValue:
      description: |
        A property value (specification §1.3): a number, a string, a boolean, a date-time or an
        address written as a string, or a list of these.
      oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: array
          items:
            oneOf:
              - type: string
              - type: number
              - type: boolean
    ArtifactHeader:
      type: object
      description: |
        An Artifact's properties (specification §1.5 and §2, profile §1 and §2.1). Members may
        add properties of their own.
      required: [name, type, created, published_by, specification_version]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        type:
          type: string
          description: Argument, Data, ScientificPublication, Analysis, Model, NonGroundable, Message, ResearchGoal, or a type of the Member's own.
        created:
          type: string
          format: date-time
          description: Stamped by the gate at acceptance.
        published_by:
          $ref: '#/components/schemas/Address'
        specification_version:
          type: string
        title:
          type: string
        description:
          type: string
        text:
          type: string
        authors:
          type: array
          items:
            type: string
        supersedes:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        supersedes_rationale:
          type: string
        import_method:
          type: string
        produced_by:
          $ref: '#/components/schemas/Address'
        groundable:
          type: boolean
        serves_goals:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        primary_assertion:
          type: string
          description: Argument. The name of its primary Assertion.
        verdict:
          type: string
          description: Argument.
        rationale:
          type: string
          description: Argument.
        purpose:
          type: string
          description: Argument.
        genre:
          type: string
          description: Argument, profile. `finding` or `assessment`.
        extracted_from:
          $ref: '#/components/schemas/Address'
        extraction_method:
          type: string
        procedure:
          type: string
          description: Analysis.
        inputs:
          type: array
          description: Analysis.
          items:
            $ref: '#/components/schemas/Address'
        modeling_choices:
          type: string
          description: Model.
        recipients:
          type: array
          description: Message.
          items:
            $ref: '#/components/schemas/Address'
      additionalProperties:
        $ref: '#/components/schemas/PropertyValue'
    SubmittedHeader:
      description: A header as an author submits it. `created` is null; the gate stamps it.
      allOf:
        - $ref: '#/components/schemas/ArtifactHeader'
        - type: object
          properties:
            created:
              type: 'null'
    RecordObject:
      type: object
      description: |
        An Object (specification §1.6). Assertion, Ground, Assumption and Content carry the
        properties the specification requires of them; any other type is the author's.
      required: [name, type]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        type:
          type: string
        title:
          type: string
        description:
          type: string
        text:
          type: string
        claim:
          type: string
          description: Assertion.
        scope:
          type: string
          description: Assertion.
        citation:
          $ref: '#/components/schemas/Address'
        rationale:
          type: string
          description: Ground, Assumption.
        criterion:
          type: string
          description: Ground. Its presence marks the Ground as a test.
        addressing_method:
          type: string
          description: Content.
        groundable:
          type: boolean
          description: Content.
        location:
          type: string
          description: Content.
        access_method:
          type: string
          description: Content.
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Content, profile.
      additionalProperties:
        $ref: '#/components/schemas/PropertyValue'
    Relationship:
      type: object
      description: A directed relationship between two Objects of one Artifact (specification §1.7).
      required: [rel, source, target]
      properties:
        rel:
          type: string
        source:
          $ref: '#/components/schemas/Name'
        target:
          $ref: '#/components/schemas/Name'
      additionalProperties:
        $ref: '#/components/schemas/PropertyValue'
    CanonicalArtifact:
      type: object
      description: One Artifact in canonical JSON (profile §1).
      required: [artifact, objects, relationships]
      properties:
        artifact:
          $ref: '#/components/schemas/ArtifactHeader'
        objects:
          type: array
          items:
            $ref: '#/components/schemas/RecordObject'
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/Relationship'
    SubmittedArtifact:
      type: object
      description: One Artifact in canonical JSON as its author submits it.
      required: [artifact, objects, relationships]
      properties:
        artifact:
          $ref: '#/components/schemas/SubmittedHeader'
        objects:
          type: array
          items:
            $ref: '#/components/schemas/RecordObject'
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/Relationship'
    Page:
      type: object
      description: The fields every paged listing carries.
      required: [next, position]
      properties:
        next:
          description: The cursor of the following page; null on the last page.
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
        position:
          $ref: '#/components/schemas/Position'
    RecordState:
      type: object
      required: [community, url, position, counts, members, specification_versions]
      properties:
        community:
          $ref: '#/components/schemas/CommunityName'
        url:
          type: string
          format: uri
        position:
          $ref: '#/components/schemas/Position'
        counts:
          type: object
          required: [artifacts, by_type, by_member, findings]
          properties:
            artifacts:
              type: integer
            by_type:
              type: object
              additionalProperties:
                type: integer
            by_member:
              type: object
              additionalProperties:
                type: integer
            findings:
              type: object
              description: Findings against the current record, by level.
              additionalProperties:
                type: integer
        members:
          type: integer
          description: Handles on the roster.
        first_created:
          type: [string, 'null']
          format: date-time
        specification_versions:
          type: array
          items:
            type: string
    ArtifactSummary:
      type: object
      description: One Artifact as a listing shows it, as the record browser's contents page does.
      required: [name, address, url, type, published_by, created]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        address:
          $ref: '#/components/schemas/Address'
        url:
          type: string
          format: uri
        type:
          type: string
        title:
          type: string
        published_by:
          $ref: '#/components/schemas/Handle'
        created:
          type: string
          format: date-time
        groundable:
          type: boolean
          description: False for a non-groundable type or a header saying so.
        verdict_excerpt:
          type: string
          description: Argument. The first two sentences of its verdict.
        supersedes:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        superseded_by:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        counts:
          type: object
          properties:
            objects:
              type: integer
            grounds:
              type: integer
            tests:
              type: integer
              description: Grounds carrying a `criterion`.
            findings:
              type: integer
    ArtifactSummaryPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ArtifactSummary'
    ArtifactResource:
      type: object
      required: [url, address, position, links, canonical]
      properties:
        url:
          type: string
          format: uri
        address:
          $ref: '#/components/schemas/Address'
        position:
          $ref: '#/components/schemas/Position'
        links:
          type: object
          required: [member, supersedes, superseded_by, cited_by, findings]
          properties:
            member:
              type: string
              format: uri
            supersedes:
              type: array
              items:
                type: string
                format: uri
            superseded_by:
              type: array
              items:
                type: string
                format: uri
            produced_by:
              type: string
              format: uri
            cited_by:
              type: string
              format: uri
            findings:
              type: string
              format: uri
            claim_graph:
              type: string
              format: uri
              description: Argument.
            evidence:
              type: string
              format: uri
              description: Argument.
            internal_graph:
              type: string
              format: uri
            content:
              type: string
              format: uri
              description: Where the stored canonical JSON is, on the data server's `/v1`.
        canonical:
          $ref: '#/components/schemas/CanonicalArtifact'
    PropertyResource:
      type: object
      required: [url, address, property, value, position]
      properties:
        url:
          type: string
          format: uri
        address:
          $ref: '#/components/schemas/Address'
        property:
          type: string
        value:
          $ref: '#/components/schemas/PropertyValue'
        position:
          $ref: '#/components/schemas/Position'
    ObjectEntry:
      type: object
      required: [url, address, object]
      properties:
        url:
          type: string
          format: uri
        address:
          $ref: '#/components/schemas/Address'
        object:
          $ref: '#/components/schemas/RecordObject'
    ObjectPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ObjectEntry'
    ObjectResource:
      type: object
      required: [url, address, artifact_url, object, position, relationships_url]
      properties:
        url:
          type: string
          format: uri
        address:
          $ref: '#/components/schemas/Address'
        artifact_url:
          type: string
          format: uri
        object:
          $ref: '#/components/schemas/RecordObject'
        relationships_url:
          type: string
          format: uri
          description: The Artifact's relationships, narrowed to those touching this Object.
        position:
          $ref: '#/components/schemas/Position'
    RelationshipPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Relationship'
    CitationVia:
      type: string
      description: How a later Artifact cites this one.
      enum:
        - ground
        - testimony
        - produced_by
        - inputs
        - supersedes
        - extracted_from
        - serves_goals
        - recipients
        - prose
    Citation:
      type: object
      description: One citation of this Artifact or its content by a later Artifact.
      required: [via, address, from, from_url, from_type, from_created]
      properties:
        via:
          $ref: '#/components/schemas/CitationVia'
        address:
          $ref: '#/components/schemas/Address'
        from:
          $ref: '#/components/schemas/Address'
        from_url:
          type: string
          format: uri
        from_type:
          type: string
        from_created:
          type: string
          format: date-time
        ground:
          description: For `ground` and `testimony`, the citing Ground's address.
          $ref: '#/components/schemas/Address'
    CitationPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Citation'
    SupersessionEntry:
      type: object
      required: [address, url, created, direction, distance]
      properties:
        address:
          $ref: '#/components/schemas/Address'
        url:
          type: string
          format: uri
        created:
          type: string
          format: date-time
        direction:
          type: string
          enum: [earlier, later]
        distance:
          type: integer
          minimum: 1
        supersedes_rationale:
          type: string
    SupersessionPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SupersessionEntry'
    FindingLevel:
      type: string
      enum: [FAIL, REVIEW]
    Finding:
      type: object
      description: One finding of the validator, as `tools/validate.py` writes it.
      required: [check, level, msg]
      properties:
        check:
          type: string
          description: STRUCT, TYPE, ADDRESS, GROUND, CITATION, GOAL, INDEPENDENCE, NAMING, ORDER, SIZE, SUPERSEDED, UNIQUE.
        level:
          $ref: '#/components/schemas/FindingLevel'
        msg:
          type: string
        object:
          description: The Object the finding names, where it names one.
          $ref: '#/components/schemas/Name'
    FindingPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items, basis]
          properties:
            basis:
              type: string
              enum: [accepted, current]
            items:
              type: array
              items:
                $ref: '#/components/schemas/Finding'
    GraphNode:
      type: object
      required: [id, kind, label]
      properties:
        id:
          type: string
        kind:
          type: string
          description: |
            Claim graph: Assertion, Ground, Assumption, Source (cited material), External (an
            Assertion in another Argument), ProseCitation. Overview: Artifact. Internal graph:
            the Object's own type.
        label:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        url:
          type: string
          format: uri
        member:
          $ref: '#/components/schemas/Handle'
        primary:
          type: boolean
          description: Claim graph. True on the primary Assertion.
        unverifiable:
          type: boolean
          description: Claim graph. True when reached through `rest` or `download`.
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PropertyValue'
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
    GraphEdge:
      type: object
      required: [id, rel, source, target]
      properties:
        id:
          type: string
        rel:
          type: string
          description: |
            Claim graph: depends_on, grounded_by, assumes, addresses, cites. Overview: the
            citation kinds of `CitationVia`. Internal graph: the relationship's own `rel`.
        source:
          type: string
        target:
          type: string
        kind:
          type: string
          enum: [test, evidential]
          description: Claim graph, `grounded_by`. `test` when the Ground carries a criterion.
        testimony:
          type: boolean
          description: Claim graph. True when the Ground cites another Argument's Assertion.
        count:
          type: integer
          description: Overview. How many citations of this kind the edge stands for.
        properties:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/PropertyValue'
    ClaimGraph:
      type: object
      required: [url, argument, mode, verdict, rationale, purpose, nodes, edges, counts, position]
      properties:
        url:
          type: string
          format: uri
        argument:
          $ref: '#/components/schemas/ArtifactSummary'
        mode:
          type: string
          enum: [claim, full]
        verdict:
          type: string
        rationale:
          type: string
        purpose:
          type: string
        genre:
          type: string
        supersedes:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        supersedes_rationale:
          type: string
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'
        counts:
          type: object
          properties:
            assertions:
              type: integer
            grounds:
              type: integer
            tests:
              type: integer
            assumptions:
              type: integer
            sources:
              type: integer
            shared_sources:
              type: integer
            unverifiable:
              type: integer
            findings:
              type: integer
        position:
          $ref: '#/components/schemas/Position'
    EvidenceRow:
      type: object
      required: [ground, citation, citation_url, rationale, kind]
      properties:
        ground:
          $ref: '#/components/schemas/Address'
        citation:
          $ref: '#/components/schemas/Address'
        citation_url:
          type: string
          format: uri
        rationale:
          type: string
        criterion:
          type: string
        kind:
          type: string
          enum: [test, evidential]
    EvidenceTable:
      type: object
      required: [url, argument, assertions, position]
      properties:
        url:
          type: string
          format: uri
        argument:
          $ref: '#/components/schemas/ArtifactSummary'
        assertions:
          type: array
          description: Primary first.
          items:
            type: object
            required: [assertion, claim, scope, primary, grounds]
            properties:
              assertion:
                $ref: '#/components/schemas/Address'
              claim:
                type: string
              scope:
                type: string
              primary:
                type: boolean
              grounds:
                type: array
                items:
                  $ref: '#/components/schemas/EvidenceRow'
        position:
          $ref: '#/components/schemas/Position'
    InternalGraph:
      type: object
      required: [url, artifact, nodes, edges, legend, content, position]
      properties:
        url:
          type: string
          format: uri
        artifact:
          $ref: '#/components/schemas/ArtifactSummary'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'
        legend:
          type: object
          properties:
            types:
              type: array
              items:
                type: string
            rels:
              type: array
              items:
                type: string
        content:
          type: array
          description: The Artifact's Content Objects, which say how to reach its content.
          items:
            $ref: '#/components/schemas/ObjectEntry'
        position:
          $ref: '#/components/schemas/Position'
    GroundedSpan:
      type: object
      required: [property, quote, address, ground, ground_url, from_created]
      properties:
        property:
          type: string
        quote:
          type: string
        address:
          $ref: '#/components/schemas/Address'
        ground:
          $ref: '#/components/schemas/Address'
        ground_url:
          type: string
          format: uri
        from_created:
          type: string
          format: date-time
    GroundedSpanPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/GroundedSpan'
    Resolution:
      type: object
      required: [address, kind, url, position]
      properties:
        address:
          $ref: '#/components/schemas/Address'
        kind:
          type: string
          enum: [member, artifact, object, property, object_property]
        url:
          type: string
          format: uri
        artifact:
          $ref: '#/components/schemas/Name'
        object:
          $ref: '#/components/schemas/Name'
        property:
          type: string
        node_type:
          type: string
          description: The type of the Artifact or Object named.
        method:
          type: string
          description: The Content Object a schema reference reaches through.
        ref:
          type: string
          description: The reference string after the Content Object's name.
        verified:
          type: boolean
          description: True when the server checked the reference against embedded content.
        value:
          description: The value reached, where the address reaches one.
          $ref: '#/components/schemas/PropertyValue'
        location:
          type: string
          description: For `rest` and `download`, the Content Object's `location`.
        access_method:
          type: string
          description: For `rest` and `download`, the Content Object's `access_method`.
        position:
          $ref: '#/components/schemas/Position'
    OverviewPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [nodes, edges, counts]
          properties:
            nodes:
              type: array
              items:
                $ref: '#/components/schemas/GraphNode'
            edges:
              type: array
              items:
                $ref: '#/components/schemas/GraphEdge'
            counts:
              type: object
              description: Counts for the whole record, on every page.
              properties:
                artifacts:
                  type: integer
                cross_edges:
                  type: integer
                findings:
                  type: integer
    MemberResource:
      type: object
      required: [handle, address, url, registered, palette_index, counts, position]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        address:
          $ref: '#/components/schemas/Address'
        url:
          type: string
          format: uri
        registered:
          type: boolean
          description: True once the Member has joined from its invite.
        palette_index:
          type: integer
          minimum: 0
          description: |
            The Member's place among the handles that published anything, sorted. The record
            browser colours by it, so every client colours a Member alike.
        counts:
          type: object
          properties:
            artifacts:
              type: integer
            by_type:
              type: object
              additionalProperties:
                type: integer
        artifacts_url:
          type: string
          format: uri
        messages_url:
          type: string
          format: uri
        position:
          $ref: '#/components/schemas/Position'
    MemberPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MemberResource'
    KeyRole:
      type: string
      description: |
        The key's one role. `member` holds everything `non-member` holds, and `admin` holds
        everything `member` holds.
      enum: [non-member, member, admin]
    KeyScope:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [community, server]
        community:
          $ref: '#/components/schemas/CommunityName'
    Me:
      type: object
      required: [username, role, scope, key_id, position]
      properties:
        username:
          type: string
        role:
          $ref: '#/components/schemas/KeyRole'
        scope:
          $ref: '#/components/schemas/KeyScope'
        key_id:
          type: string
          format: uuid
        expires:
          type: [string, 'null']
          format: date-time
        member_url:
          type: string
          format: uri
          description: The Member this key publishes as, where it holds `member`.
        position:
          $ref: '#/components/schemas/Position'
    PublishRole:
      type: object
      required: [name, may_publish]
      properties:
        name:
          type: string
        description:
          type: string
        may_publish:
          type: array
          items:
            type: string
    PublishRoleList:
      type: object
      required: [roles, position]
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/PublishRole'
        position:
          $ref: '#/components/schemas/Position'
    SubmissionCheck:
      type: object
      required: [ok, role, findings, position]
      properties:
        ok:
          type: boolean
        role:
          type: string
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        position:
          $ref: '#/components/schemas/Position'
    SubmissionStatus:
      type: string
      description: |
        `pending` until the gate decides. `deferred` while a server-side gate pass waits for
        an Analysis the submission names. `skipped` when the gate's own rule sets it aside: its
        inbox name is the artifact's name with the wrong prefix, or its submitter is off the
        roster. Then `accepted` or `rejected`. `api/DESIGN.md` §7 says where each comes from.
      enum: [pending, deferred, skipped, accepted, rejected]
    SubmissionResource:
      type: object
      required: [id, url, name, submitted_by, submitted, status, citation, position]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        name:
          $ref: '#/components/schemas/Name'
        type:
          type: string
        submitted_by:
          $ref: '#/components/schemas/Handle'
        submitted:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        citation:
          type: string
          description: The submission's file version on the data server, `symposium-data:<uuid>@v1`.
        role:
          type: string
          description: The publishing role it was checked under.
        decided:
          type: [string, 'null']
          format: date-time
        artifact_url:
          type: string
          format: uri
          description: Accepted. The record Artifact.
        reply_url:
          type: string
          format: uri
          description: Rejected. The gate's reply.
        position:
          $ref: '#/components/schemas/Position'
    SubmissionPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SubmissionResource'
    ReplyResource:
      type: object
      required: [id, url, sender, recipients, sent, in_reply_to, submission_url, text, position]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        sender:
          $ref: '#/components/schemas/Handle'
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/Handle'
        sent:
          type: string
          format: date-time
        in_reply_to:
          $ref: '#/components/schemas/Name'
        submission_url:
          type: string
          format: uri
        text:
          type: string
          description: The reply as the gate wrote it, `REJECTED` and one line per failure.
        failures:
          type: array
          items:
            type: string
        position:
          $ref: '#/components/schemas/Position'
    ReplyPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ReplyResource'
    StreamEventBase:
      type: object
      description: One Server-Sent Events frame. `id` is a cursor for `Last-Event-ID`.
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/Cursor'
        event:
          type: string
        data:
          type: object
    HeartbeatEvent:
      allOf:
        - $ref: '#/components/schemas/StreamEventBase'
        - type: object
          properties:
            event:
              const: heartbeat
            data:
              type: object
              required: [position]
              properties:
                position:
                  $ref: '#/components/schemas/Position'
    RecordStreamEvent:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/StreamEventBase'
            - type: object
              properties:
                event:
                  const: artifact
                data:
                  $ref: '#/components/schemas/ArtifactSummary'
        - $ref: '#/components/schemas/HeartbeatEvent'
    SubmissionStreamEvent:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/StreamEventBase'
            - type: object
              properties:
                event:
                  enum:
                    - submission.received
                    - submission.accepted
                    - submission.rejected
                    - submission.deferred
                    - submission.skipped
                data:
                  $ref: '#/components/schemas/SubmissionResource'
        - $ref: '#/components/schemas/HeartbeatEvent'
    ReplyStreamEvent:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/StreamEventBase'
            - type: object
              properties:
                event:
                  const: reply
                data:
                  $ref: '#/components/schemas/ReplyResource'
        - $ref: '#/components/schemas/HeartbeatEvent'
    GatePassRequest:
      type: object
      properties:
        dry_run:
          type: boolean
          default: false
          description: Decide and report; promote, reply and save nothing.
    GateDecision:
      type: object
      required: [submission, name, outcome]
      properties:
        submission:
          type: string
          format: uri
        name:
          $ref: '#/components/schemas/Name'
        outcome:
          type: string
          enum: [accepted, rejected, deferred, skipped]
        artifact_url:
          type: string
          format: uri
        reply_url:
          type: string
          format: uri
        failures:
          type: array
          items:
            type: string
        reason:
          type: string
          description: Deferred or skipped. Why.
    GatePassReport:
      type: object
      required: [dry_run, decisions, position]
      properties:
        dry_run:
          type: boolean
        decisions:
          type: array
          description: |
            One entry per submission the pass considered, in the order it decided them. A pass
            reads at most 1000 waiting submissions; the rest wait for the next pass.
          items:
            $ref: '#/components/schemas/GateDecision'
        more:
          type: boolean
          description: True when submissions remain for another pass.
        position:
          $ref: '#/components/schemas/Position'
    GateVerifyReport:
      type: object
      required: [ok, checked, differences, position]
      properties:
        ok:
          type: boolean
        checked:
          type: integer
        differences:
          type: array
          items:
            type: object
            required: [name, kind]
            properties:
              name:
                $ref: '#/components/schemas/Name'
              kind:
                type: string
                enum: [missing, extra, changed]
        position:
          $ref: '#/components/schemas/Position'
    GateRebuild:
      type: object
      required: [started, position]
      properties:
        started:
          type: string
          format: date-time
        position:
          $ref: '#/components/schemas/Position'
    ApiKeyCreate:
      type: object
      required: [username, role, scope]
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
          description: |
            For `member`, a handle registered on the scope's roster. For a server-scoped
            `admin` key, the server's admin handle. For `non-member`, a label naming the
            application, which matches no handle on the roster.
        role:
          $ref: '#/components/schemas/KeyRole'
        scope:
          $ref: '#/components/schemas/KeyScope'
        expires_days:
          type: integer
          minimum: 1
          maximum: 366
          description: Absent for a key that lasts until revoked.
        label:
          type: string
          maxLength: 200
    ApiKey:
      type: object
      required: [id, url, username, role, scope, key, created, created_by, expires, revoked, last_used, uses]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        username:
          type: string
        role:
          $ref: '#/components/schemas/KeyRole'
        scope:
          $ref: '#/components/schemas/KeyScope'
        key:
          type: [string, 'null']
          pattern: ^sak_[A-Za-z0-9_-]{43}$
          description: The key. Null once revoked.
        label:
          type: string
        created:
          type: string
          format: date-time
        created_by:
          type: string
        expires:
          type: [string, 'null']
          format: date-time
        revoked:
          type: [string, 'null']
          format: date-time
        revoked_by:
          type: [string, 'null']
        last_used:
          type: [string, 'null']
          format: date-time
        uses:
          type: integer
    ApiKeyPage:
      type: object
      description: |
        A page of API keys. Keys belong to the server, outside any record, so the page carries
        no `position`.
      required: [items, next]
      properties:
        next:
          description: The cursor of the following page; null on the last page.
          oneOf:
            - $ref: '#/components/schemas/Cursor'
            - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApiKey'
