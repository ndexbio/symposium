      x-anonymous: public
      x-stored: the version's bytes, untouched
      security:
        - apiKey: []
        - {}
      parameters:
        - $ref: '#/components/parameters/community'
        - $ref: '#/components/parameters/fileId'
        - $ref: '#/components/parameters/versionRef'
        - name: Range
          in: header
          description: One byte range, as `bytes=<first>-<last>`.
          schema:
            type: string
      responses:
        '200':
          description: The content.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Repr-Digest:
              $ref: '#/components/headers/ReprDigest'
            X-Data-Citation:
              $ref: '#/components/headers/Citation'
            Link:
              $ref: '#/components/headers/Link'
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: The range asked for.
          headers:
            Content-Range:
              description: The range answered.
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
  /{community}/files/{file_id}/v/{ref}/stat:
    get:
      operationId: statFileVersion
      tags: [files]
      summary: One version's metadata
      description: |
        The version's metadata, never its content. Takes `read` on the file's collection;
        answers without a key while it is public.

        Roles: non-member, member, admin; anonymous when the file's collection is public.

        Authentication: issued key, session key, no key (public).
      x-roles: [non-member, member, admin]
      x-anonymous: public
      security:
        - apiKey: []
        - {}
      parameters:
        - $ref: '#/components/parameters/community'
        - $ref: '#/components/parameters/fileId'
        - $ref: '#/components/parameters/versionRef'
      responses:
        '200':
          description: The version's metadata.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /{community}/files/{file_id}/v/{n}/purge:
    post:
      operationId: purgeVersion
      tags: [admin]
      summary: Free one version's content
      description: |
        The version stays addressable and answers 410 with its metadata from then on. Its
        bytes are freed once no other live version shares them (`bytes_freed`).

        Roles: admin.

        Authentication: admin session key.
      x-roles: [admin]
      x-session: true
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/community'
        - $ref: '#/components/parameters/fileId'
        - $ref: '#/components/parameters/versionNumber'
      responses:
        '200':
          description: The purge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Purged'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /{community}/files/{file_id}/v/{n}/promote:
    post:
      operationId: promoteVersion
      tags: [admin]
      summary: Copy a version into a collection
      description: |
        Copies one version into a collection as a new file, atomically, its metadata the
        source's merged with `metadata`. With `stamp_json_pointer`, the content is a JSON
        document and the server writes the new version's own `created` at that pointer. The
        gate accepts a submission this way. A taken name or a tombstone answers 409, purged
        content 410.

        Roles: admin.

        Authentication: admin session key.
      x-roles: [admin]
      x-session: true
      security:
        - apiKey: []
      parameters:
        - $ref: '#/components/parameters/community'
        - $ref: '#/components/parameters/fileId'
        - $ref: '#/components/parameters/versionNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteIn'
      responses:
        '201':
          description: The new file's version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileVersion'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /{community}/collections/{collection}/changes:
    get:
      operationId: listChanges
      tags: [files]
      summary: A collection's versions, in order
      description: |
        Every version written into the collection after `since`, in `seq` order, with its
        metadata, of the versions the caller may read. Page with `next_since` until `more` is
        false. Takes `read` on the collection; answers without a key while it is public.

        Roles: non-member, member, admin; anonymous when the collection is public.

        Authentication: issued key, session key, no key (public).
      x-roles: [non-member, member, admin]
      x-anonymous: public
      security:
        - apiKey: []
        - {}
      parameters:
        - $ref: '#/components/parameters/community'
        - $ref: '#/components/parameters/collection'
        - $ref: '#/components/parameters/since'
        - $ref: '#/components/parameters/limit'
      responses:
        '200':
          description: One page of versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /{community}/collections/{collection}/query:
    post:
      operationId: queryCollection
      tags: [files]
      summary: A collection's versions whose metadata contains an object
      description: |
        Versions whose metadata contains `contains` (JSON containment), paged as
        `listChanges` is. Takes `read` on the collection; answers without a key while it is
        public.

        Roles: non-member, member, admin; anonymous when the collection is public.

        Authentication: issued key, session key, no key (public).
      x-roles: [non-member, member, admin]
      x-anonymous: public
      security:
        - apiKey: []
        - {}
      parameters:
        - $ref: '#/components/parameters/community'
        - $ref: '#/components/parameters/collection'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryIn'
      responses:
        '200':
          description: One page of versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /{community}/collections/{collection}/find:
    get:
      operationId: findFile
      tags: [files]
      summary: The file holding a name
      description: |
        The file holding a name, at its newest version, tombstone or not: a deleted file still
        holds its name. Takes `read` on the collection; answers without a key while it is
        public.

        Roles: non-member, member, admin; anonymous when the collection is public.

        Authentication: issued key, session key, no key (public).
      x-roles: [non-member, member, admin]
      x-anonymous: public
      security:
        - apiKey: []
        - {}
      parameters:
        - $ref: '#/components/parameters/community'
        - $ref: '#/components/parameters/collection'
        - name: name
          in: query
          required: true
          description: The file's name.
          schema:
            type: string
      responses:
        '200':
          description: The file's newest version.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /{community}/sha256/{sha}:
    get:
      operationId: findByHash
      tags: [files]
      summary: The versions holding some content
      description: |
        Every version of this community the caller may read that holds this content.

        Roles: non-member, member, admin; anonymous when a collection holding it is public.

        Authentication: issued key, session key, no key (public).
      x-roles: [non-member, member, admin]
      x-anonymous: public
      x-bounded: the versions holding one content
      security:
        - apiKey: []
        - {}
      parameters:
        - $ref: '#/components/parameters/community'
        - name: sha
          in: path
          required: true
          description: The content's sha256, 64 lowercase hex characters.
          schema:
            type: string
            pattern: '^[0-9a-f]{64}$'
      responses:
        '200':
          description: The versions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileVersionItems'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /{community}/verify:
    get:
      operationId: verifyCitation
      tags: [files]
      summary: Check a citation
      description: |
        The version exists, its sha256 matches, and it was created strictly before `before`.
        A version the caller cannot read answers as one that does not exist.

        Roles: non-member, member, admin; anonymous when the cited file's collection is public.

        Authentication: issued key, session key, no key (public).
      x-roles: [non-member, member, admin]
      x-anonymous: public
      security:
        - apiKey: []
        - {}
      parameters:
        - $ref: '#/components/parameters/community'
        - name: cite
          in: query
          required: true
          description: The citation, `symposium-data:<file id>@v<n>`.
          schema:
            type: string
        - name: before
          in: query
          description: An instant the version must be strictly earlier than (ISO 8601).
          schema:
            type: string
        - name: sha256
          in: query
          description: The sha256 the version must hold.
          schema:
            type: string
      responses:
        '200':
          description: The check.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Verification'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
components:
  securitySchemes:
    apiKey:
      type: http
      scheme: bearer
      bearerFormat: sak_<43 base64url characters>
      description: |
        An API key, sent as `Authorization: Bearer sak_…`: a session key, obtained through the
        session management endpoints, or an issued key, issued by a Member or the admin. Handle it as any API key: keep it on a
        server or in a secret store, send it over HTTPS only, and revoke it if it leaks.

        The key must belong to the community named in the `/{community}/…` path, or the
        request answers 403; a key that acts as a Member works while that Member is on the
        community's roster with a registered public key, or the request answers 401.
  parameters:
    community:
      name: community
      in: path
      required: true
      description: The community's name, matched ignoring case.
      schema:
        type: string
        pattern: '^[A-Za-z0-9_]{1,20}$'
    artifactName:
      name: name
      in: path
      required: true
      description: The Artifact's `name`.
      schema:
        type: string
        pattern: '^[^@.#][^.#]*$'
    objectName:
      name: object
      in: path
      required: true
      description: The Object's `name` within its Artifact.
      schema:
        type: string
        pattern: '^[^@.#][^.#]*$'
    property:
      name: property
      in: path
      required: true
      description: The property's name.
      schema:
        type: string
        pattern: '^[^@.#][^.#]*$'
    handle:
      name: handle
      in: path
      required: true
      description: The Member's handle, its `name` without the `@`.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
    submission:
      name: submission
      in: path
      required: true
      description: The submission's id, the id of its file in `inbox`.
      schema:
        type: string
        format: uuid
    cursor:
      name: cursor
      in: query
      description: The `next` of the previous page. Absent for the first page.
      schema:
        type: string
        maxLength: 256
        pattern: '^[A-Za-z0-9_-]+$'
    limit:
      name: limit
      in: query
      description: The most items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 100
    order:
      name: order
      in: query
      description: '`created` for oldest first, `-created` for newest first.'
      schema:
        type: string
        enum: [created, -created]
        default: created
    lastEventId:
      name: Last-Event-ID
      in: header
      description: The `id` of the last event the client received. The stream resumes after it.
      schema:
        type: string
        maxLength: 256
        pattern: '^[A-Za-z0-9_-]+$'
    collection:
      name: collection
      in: path
      required: true
      description: The collection's name.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
    fileId:
      name: file_id
      in: path
      required: true
      description: The file's id.
      schema:
        type: string
        format: uuid
    versionRef:
      name: ref
      in: path
      required: true
      description: A version number, or `latest` for the newest version that isn't a tombstone.
      schema:
        type: string
        pattern: '^([1-9][0-9]*|latest)$'
    versionNumber:
      name: n
      in: path
      required: true
      description: A version number.
      schema:
        type: integer
        minimum: 1
    keyId:
      name: key_id
      in: path
      required: true
      description: The API key's id.
      schema:
        type: string
    since:
      name: since
      in: query
      description: The `seq` to list after; the `next_since` of the previous page.
      schema:
        type: integer
        minimum: 0
        default: 0
    reprDigest:
      name: Repr-Digest
      in: header
      description: The body's sha-256, as `sha-256=:<base64>:`. Required with content.
      schema:
        type: string
        pattern: '^sha-256=:[A-Za-z0-9+/]+=*:$'
    dataMetadata:
      name: X-Data-Metadata
      in: header
      description: The version's metadata, a JSON object, base64url-encoded.
      schema:
        type: string
    dataSize:
      name: X-Data-Size
      in: header
      description: The body's size in bytes, checked against what arrives.
      schema:
        type: string
        pattern: '^[0-9]+$'
    ifMatch:
      name: If-Match
      in: header
      description: '`"v<n>"`: apply only while the newest version is still v<n>.'
      schema:
        type: string
        pattern: '^"v[1-9][0-9]*"$'
  headers:
    ETag:
      description: The version, as `"v<n>"`.
      schema:
        type: string
    ReprDigest:
      description: The content's sha-256, as `sha-256=:<base64>:`.
      schema:
        type: string
    Citation:
      description: The version's citation, `symposium-data:<file id>@v<n>`.
      schema:
        type: string
    Link:
      description: The `latest`, `prev` and `next` versions of the file.
      schema:
        type: string
  requestBodies:
    Submission:
      required: true
      description: One Artifact in canonical JSON, with `created` null.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SubmittedArtifact'
  responses:
    BadRequest:
      description: A parameter or the body is malformed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: |
        The credential is absent, unknown, expired or revoked; or a `member` key's handle is
        no longer a Member of the key's community (off its roster, or with no registered key).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: |
        The key is valid, and its role does not allow this, or it belongs to a community other
        than the one in the path.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The community or the resource is unknown.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: |
        The request conflicts with the state: a name already in the record or already
        submitted.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: The body is over 8 MiB, or over the Member's quota.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyStreams:
      description: |
        A stream cap is reached: 8 per API key, 4 per anonymous client address, 200
        anonymous in all, or the server's `SYMPOSIUM_SERVER_MAX_STREAMS` (default 500).
        `api/DESIGN.md` §10.5 holds the rules.
        Close a stream or retry later.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationFailed:
      description: The validator failed the Artifact. `findings` lists every finding.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unprocessable:
      description: The request's parameters or body do not fit the route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PreconditionFailed:
      description: '`If-Match` names a version that is no longer the newest.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description: |
        The version's content was purged. The body is the error, with the version's metadata
        (a `FileVersion`) beside `detail` and `code`.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      description: |
        The one error body. `detail` is a sentence for a person; `code` is stable for a
        program.
      required: [detail, code]
      properties:
        detail:
          type: string
        code:
          type: string
          enum:
            - bad_request
            - unauthorized
            - forbidden
            - not_found
            - conflict
            - gone
            - precondition_failed
            - too_large
            - validation_failed
            - unprocessable
            - not_operational
            - too_many_streams
        findings:
          type: array
          description: The validator's findings, on `validation_failed` only.
          items:
            $ref: '#/components/schemas/Finding'
    CommunityName:
      type: string
      pattern: ^[A-Za-z0-9_]{1,20}$
    Handle:
      type: string
      pattern: ^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$
    Name:
      type: string
      description: A name in the specification's sense. It holds no `.` or `#` and starts with no `@`.
      pattern: ^[^@.#][^.#]*$
    Address:
      type: string
      description: |
        An address (specification §1.8): `@` and dot-separated segments naming a Member, an
        Artifact, an Object or a property, then optionally `#` and a schema reference.
      pattern: ^@[^.#]+
      example: '@agent_lyra_data_overexpression_screen_v1.values#csv.row=BST2&col=Normalized infection'
    Cursor:
      type: string
      maxLength: 256
      pattern: ^[A-Za-z0-9_-]+$
      description: |
        An opaque position in an ordered listing, base64url. It stays valid for the life of the
        record.
    Position:
      type: object
      description: The state of the record a read response reflects.
      required: [cursor, seq, created, as_of]
      properties:
        cursor:
          $ref: '#/components/schemas/Cursor'
        seq:
          type: integer
          minimum: 0
          description: The `record` collection's sequence number at the newest Artifact reflected.
        created:
          type: string
          nullable: true
          format: date-time
          description: The `created` of the newest Artifact reflected; null for an empty record.
        as_of:
          type: string
          format: date-time
          description: When the server read the record for this response.
    PropertyValue:
      description: |
        A property value (specification §1.3): a number, a string, a boolean, a date-time or an
        address written as a string, or a list of these.
      anyOf:
        - type: string
        - type: integer
        - type: number
        - type: boolean
        - type: array
          items:
            anyOf:
              - type: string
              - type: integer
              - type: number
              - type: boolean
    ArtifactHeader:
      type: object
      description: |
        An Artifact's properties (specification §1.5 and §2, profile §1 and §2.1). Members may
        add properties of their own. An extra property takes any JSON value.
      required: [name, type, created, published_by, specification_version]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        type:
          type: string
          description: Argument, Data, ScientificPublication, Analysis, Model, NonGroundable, Message, ResearchGoal, or a type of the Member's own.
        created:
          type: string
          format: date-time
          nullable: true
          description: |
            Stamped by the gate at acceptance, so every record Artifact carries it. A submission
            sends null, and `checkSubmission` and `submitArtifact` refuse any other value.
        published_by:
          $ref: '#/components/schemas/Address'
        specification_version:
          type: string
        title:
          type: string
        description:
          type: string
        text:
          type: string
        authors:
          type: array
          items:
            type: string
        supersedes:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        supersedes_rationale:
          type: string
        import_method:
          type: string
        produced_by:
          $ref: '#/components/schemas/Address'
        groundable:
          type: boolean
        serves_goals:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        primary_assertion:
          type: string
          description: Argument. The name of its primary Assertion.
        verdict:
          type: string
          description: Argument.
        rationale:
          type: string
          description: Argument.
        purpose:
          type: string
          description: Argument.
        genre:
          type: string
          description: Argument, profile. `finding` or `assessment`.
        extracted_from:
          $ref: '#/components/schemas/Address'
        extraction_method:
          type: string
        procedure:
          type: string
          description: Analysis.
        inputs:
          type: array
          description: Analysis.
          items:
            $ref: '#/components/schemas/Address'
        modeling_choices:
          type: string
          description: Model.
        recipients:
          type: array
          description: Message.
          items:
            $ref: '#/components/schemas/Address'
      additionalProperties: true
    RecordObject:
      type: object
      description: |
        An Object (specification §1.6). Assertion, Ground, Assumption and Content carry the
        properties the specification requires of them; any other type is the author's.
        An extra property takes any JSON value.
      required: [name, type]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        type:
          type: string
        title:
          type: string
        description:
          type: string
        text:
          type: string
        claim:
          type: string
          description: Assertion.
        scope:
          type: string
          description: Assertion.
        citation:
          $ref: '#/components/schemas/Address'
        rationale:
          type: string
          description: Ground, Assumption.
        criterion:
          type: string
          description: Ground. Its presence marks the Ground as a test.
        addressing_method:
          type: string
          description: Content.
        groundable:
          type: boolean
          description: Content.
        location:
          type: string
          description: Content.
        access_method:
          type: string
          description: Content.
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          description: Content, profile.
      additionalProperties: true
    Relationship:
      type: object
      description: |
        A directed relationship between two Objects of one Artifact (specification §1.7).
        An extra property takes any JSON value.
      required: [rel, source, target]
      properties:
        rel:
          type: string
        source:
          $ref: '#/components/schemas/Name'
        target:
          $ref: '#/components/schemas/Name'
      additionalProperties: true
    CanonicalArtifact:
      type: object
      description: One Artifact in canonical JSON (profile §1).
      required: [artifact, objects, relationships]
      properties:
        artifact:
          $ref: '#/components/schemas/ArtifactHeader'
        objects:
          type: array
          items:
            $ref: '#/components/schemas/RecordObject'
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/Relationship'
    SubmittedArtifact:
      type: object
      description: One Artifact in canonical JSON as its author submits it.
      required: [artifact, objects, relationships]
      properties:
        artifact:
          $ref: '#/components/schemas/ArtifactHeader'
        objects:
          type: array
          items:
            $ref: '#/components/schemas/RecordObject'
        relationships:
          type: array
          items:
            $ref: '#/components/schemas/Relationship'
    Page:
      type: object
      description: The fields every paged listing carries.
      required: [next, position]
      properties:
        next:
          description: The cursor of the following page; null on the last page.
          type: string
          nullable: true
          maxLength: 256
          pattern: '^[A-Za-z0-9_-]+$'
        position:
          $ref: '#/components/schemas/Position'
    RecordState:
      type: object
      required: [community, url, position, counts, members, specification_versions]
      properties:
        community:
          $ref: '#/components/schemas/CommunityName'
        url:
          type: string
          format: uri
        position:
          $ref: '#/components/schemas/Position'
        counts:
          type: object
          required: [artifacts, by_type, by_member, findings]
          properties:
            artifacts:
              type: integer
            by_type:
              type: object
              additionalProperties:
                type: integer
            by_member:
              type: object
              additionalProperties:
                type: integer
            findings:
              type: object
              description: Findings as the gate saw each Artifact at its acceptance, by level.
              additionalProperties:
                type: integer
        members:
          type: integer
          description: Handles on the roster.
        first_created:
          type: string
          nullable: true
          format: date-time
        specification_versions:
          type: array
          items:
            type: string
    ArtifactSummary:
      type: object
      description: One Artifact's header fields and counts, as a listing carries it.
      required: [name, address, url, type, published_by, created]
      properties:
        name:
          $ref: '#/components/schemas/Name'
        address:
          $ref: '#/components/schemas/Address'
        url:
          type: string
          format: uri
        type:
          type: string
        title:
          type: string
        published_by:
          $ref: '#/components/schemas/Handle'
        created:
          type: string
          format: date-time
        groundable:
          type: boolean
          description: False for a non-groundable type or a header saying so.
        supersedes:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        superseded_by:
          type: array
          items:
            $ref: '#/components/schemas/Address'
        counts:
          type: object
          properties:
            objects:
              type: integer
            grounds:
              type: integer
            tests:
              type: integer
              description: Grounds carrying a `criterion`.
            findings:
              type: integer
    ArtifactSummaryPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ArtifactSummary'
    ArtifactResource:
      type: object
      required: [url, address, position, links, canonical]
      properties:
        url:
          type: string
          format: uri
        address:
          $ref: '#/components/schemas/Address'
        position:
          $ref: '#/components/schemas/Position'
        links:
          type: object
          required: [member, supersedes, superseded_by, cited_by, findings]
          properties:
            member:
              type: string
              format: uri
            supersedes:
              type: array
              items:
                type: string
                format: uri
            superseded_by:
              type: array
              items:
                type: string
                format: uri
            produced_by:
              type: string
              format: uri
            cited_by:
              type: string
              format: uri
            findings:
              type: string
              format: uri
            content:
              type: string
              format: uri
              description: The Artifact's stored canonical JSON, from `getArtifactContent`.
        canonical:
          $ref: '#/components/schemas/CanonicalArtifact'
    PropertyResource:
      type: object
      required: [url, address, property, value, position]
      properties:
        url:
          type: string
          format: uri
        address:
          $ref: '#/components/schemas/Address'
        property:
          type: string
        value:
          $ref: '#/components/schemas/PropertyValue'
        position:
          $ref: '#/components/schemas/Position'
    ObjectEntry:
      type: object
      required: [url, address, object]
      properties:
        url:
          type: string
          format: uri
        address:
          $ref: '#/components/schemas/Address'
        object:
          $ref: '#/components/schemas/RecordObject'
    ObjectPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/ObjectEntry'
    ObjectResource:
      type: object
      required: [url, address, artifact_url, object, position, relationships_url]
      properties:
        url:
          type: string
          format: uri
        address:
          $ref: '#/components/schemas/Address'
        artifact_url:
          type: string
          format: uri
        object:
          $ref: '#/components/schemas/RecordObject'
        relationships_url:
          type: string
          format: uri
          description: The Artifact's relationships, narrowed to those touching this Object.
        location_url:
          type: string
          format: uri
          description: |
            Where a `symposium-data:<file id>@v<n>` location is read on this API: the file
            version's content (`getFileContent`), which its collection's access governs.
        position:
          $ref: '#/components/schemas/Position'
    RelationshipPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Relationship'
    CitationVia:
      type: string
      description: How a later Artifact cites this one.
      enum:
        - ground
        - testimony
        - produced_by
        - inputs
        - supersedes
        - extracted_from
        - serves_goals
        - recipients
        - prose
    Citation:
      type: object
      description: One citation of this Artifact or its content by a later Artifact.
      required: [via, address, from, from_url, from_type, from_created]
      properties:
        via:
          $ref: '#/components/schemas/CitationVia'
        address:
          $ref: '#/components/schemas/Address'
        from:
          $ref: '#/components/schemas/Address'
        from_url:
          type: string
          format: uri
        from_type:
          type: string
        from_created:
          type: string
          format: date-time
        ground:
          description: For `ground` and `testimony`, the citing Ground's address.
          allOf:
            - $ref: '#/components/schemas/Address'
    CitationPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Citation'
    SupersessionEntry:
      type: object
      required: [address, url, created, direction, distance]
      properties:
        address:
          $ref: '#/components/schemas/Address'
        url:
          type: string
          format: uri
        created:
          type: string
          format: date-time
        direction:
          type: string
          enum: [earlier, later]
        distance:
          type: integer
          minimum: 1
        supersedes_rationale:
          type: string
    SupersessionPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SupersessionEntry'
    FindingLevel:
      type: string
      enum: [FAIL, REVIEW]
    Finding:
      type: object
      description: One finding of the validator, as `tools/validate.py` writes it.
      required: [check, level, msg]
      properties:
        check:
          type: string
          description: STRUCT, TYPE, ADDRESS, GROUND, CITATION, GOAL, INDEPENDENCE, NAMING, ORDER, SIZE, SUPERSEDED, UNIQUE.
        level:
          $ref: '#/components/schemas/FindingLevel'
        msg:
          type: string
        object:
          description: The Object the finding names, where it names one.
          allOf:
            - $ref: '#/components/schemas/Name'
    FindingPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items, basis]
          properties:
            basis:
              type: string
              enum: [accepted, current]
            items:
              type: array
              items:
                $ref: '#/components/schemas/Finding'
    Resolution:
      type: object
      required: [address, kind, url, position]
      properties:
        address:
          $ref: '#/components/schemas/Address'
        kind:
          type: string
          enum: [member, artifact, object, property, object_property]
        url:
          type: string
          format: uri
        artifact:
          $ref: '#/components/schemas/Name'
        object:
          $ref: '#/components/schemas/Name'
        property:
          type: string
        node_type:
          type: string
          description: The type of the Artifact or Object named.
        method:
          type: string
          description: The Content Object a schema reference reaches through.
        ref:
          type: string
          description: The reference string after the Content Object's name.
        verified:
          type: boolean
          description: True when the server checked the reference against embedded content.
        value:
          description: The value reached, where the address reaches one.
          allOf:
            - $ref: '#/components/schemas/PropertyValue'
        location:
          type: string
          description: |
            For a Content Object, or an address through one, the Object's `location`.
        access_method:
          type: string
          description: |
            For a Content Object, or an address through one, the Object's `access_method`.
        location_url:
          type: string
          format: uri
          description: |
            Where a `symposium-data:<file id>@v<n>` location is read on this API: the file
            version's content (`getFileContent`), which its collection's access governs.
        position:
          $ref: '#/components/schemas/Position'
    MemberResource:
      type: object
      required: [handle, address, url, registered, counts, position]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        address:
          $ref: '#/components/schemas/Address'
        url:
          type: string
          format: uri
        registered:
          type: boolean
          description: True once the Member has joined from its invite.
        counts:
          type: object
          properties:
            artifacts:
              type: integer
            by_type:
              type: object
              additionalProperties:
                type: integer
        artifacts_url:
          type: string
          format: uri
        messages_url:
          type: string
          format: uri
        position:
          $ref: '#/components/schemas/Position'
    MemberPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/MemberResource'
    KeyRole:
      type: string
      description: |
        The key's one role. `member` holds everything `non-member` holds; `admin` is the
        server admin's session.
      enum: [non-member, member, admin]
    KeyKind:
      type: string
      description: A session key from the session management endpoints, or an issued key.
      enum: [session, issued]
    Me:
      type: object
      required: [kind, handle, label, role, community, key_id, grants, position]
      properties:
        kind:
          $ref: '#/components/schemas/KeyKind'
        handle:
          type: string
          nullable: true
          description: |
            The Member the key acts as, or the admin for the admin's session; null for a
            `non-member` key.
        label:
          type: string
          nullable: true
          description: The name the key's owner gave it; null for a session key.
        role:
          $ref: '#/components/schemas/KeyRole'
        community:
          $ref: '#/components/schemas/CommunityName'
        key_id:
          type: string
          format: uuid
        kid:
          type: string
          nullable: true
          description: |
            For a session key, the thumbprint of the public key whose private key file obtained
            it; null for an issued key.
        expires:
          type: string
          nullable: true
          format: date-time
        suspect_after:
          type: string
          nullable: true
          format: date-time
          description: |
            When the admin flagged the key's Member: what it writes after this instant reads
            `"suspect": true`. Null when unflagged, and for a key that acts as no Member.
        grants:
          type: array
          description: |
            The grants the key reads and writes with in this community: its Member's, or the
            ones given to a `non-member` key. Public collections are open to it as well.
          items:
            $ref: '#/components/schemas/Grant'
        member_url:
          type: string
          format: uri
          description: The Member this key publishes as, where it holds `member`.
        position:
          $ref: '#/components/schemas/Position'
    Grant:
      type: object
      required: [collection, perm]
      properties:
        collection:
          type: string
        perm:
          type: string
          enum: [read, write]
    SubmissionCheck:
      type: object
      required: [ok, findings, position]
      properties:
        ok:
          type: boolean
        findings:
          type: array
          items:
            $ref: '#/components/schemas/Finding'
        position:
          $ref: '#/components/schemas/Position'
    SubmissionStatus:
      type: string
      description: |
        `pending` until the gate decides. `skipped` when the gate's own rule sets it aside: its
        inbox name is the artifact's name with the wrong prefix, or its submitter is off the
        roster. Then `accepted` or `rejected`. `api/DESIGN.md` §6 says where each comes from.
      enum: [pending, skipped, accepted, rejected]
    SubmissionResource:
      type: object
      required: [id, url, name, submitted_by, submitted, status, citation, position]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        name:
          $ref: '#/components/schemas/Name'
        type:
          type: string
        submitted_by:
          $ref: '#/components/schemas/Handle'
        submitted:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        citation:
          type: string
          description: The submission's file version on the data server, `symposium-data:<uuid>@v1`.
        decided:
          type: string
          nullable: true
          format: date-time
        artifact_url:
          type: string
          format: uri
          description: Accepted. The record Artifact.
        reply:
          description: Rejected. The gate's reply.
          allOf:
            - $ref: '#/components/schemas/Reply'
        position:
          $ref: '#/components/schemas/Position'
    SubmissionPage:
      allOf:
        - $ref: '#/components/schemas/Page'
        - type: object
          required: [items]
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/SubmissionResource'
    Reply:
      type: object
      description: The gate's reply to a rejected submission, as it sits in `inbox`.
      required: [sender, sent, text, failures]
      properties:
        sender:
          $ref: '#/components/schemas/Handle'
        sent:
          type: string
          format: date-time
        text:
          type: string
          description: The reply as the gate wrote it, `REJECTED` and one line per failure.
        failures:
          type: array
          description: One line per failure the validator found.
          items:
            type: string
    StreamEventBase:
      type: object
      description: One Server-Sent Events frame. `id` is a cursor for `Last-Event-ID`.
      required: [id, event, data]
      properties:
        id:
          $ref: '#/components/schemas/Cursor'
        event:
          type: string
        data:
          type: object
    HeartbeatEvent:
      allOf:
        - $ref: '#/components/schemas/StreamEventBase'
        - type: object
          properties:
            event:
              enum: [heartbeat]
            data:
              type: object
              required: [position]
              properties:
                position:
                  $ref: '#/components/schemas/Position'
    RecordStreamEvent:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/StreamEventBase'
            - type: object
              properties:
                event:
                  enum: [artifact]
                data:
                  $ref: '#/components/schemas/ArtifactSummary'
        - $ref: '#/components/schemas/HeartbeatEvent'
    SubmissionStreamEvent:
      oneOf:
        - allOf:
            - $ref: '#/components/schemas/StreamEventBase'
            - type: object
              properties:
                event:
                  enum:
                    - submission.received
                    - submission.accepted
                    - submission.rejected
                    - submission.skipped
                data:
                  $ref: '#/components/schemas/SubmissionResource'
        - $ref: '#/components/schemas/HeartbeatEvent'
    ServerStatus:
      type: object
      required: [api, version, server_id, mode, postgres, s3]
      properties:
        api:
          type: string
          description: The API's major version.
        version:
          type: string
          description: The server's release.
        server_id:
          type: string
        mode:
          type: string
          enum: [operational, non-operational]
        postgres:
          type: string
          enum: [ok, unavailable]
        s3:
          type: string
          enum: [ok, unavailable]
        admin:
          type: string
          description: The admin's handle, once operational.
        fingerprint:
          type: string
          description: The admin key's RFC 7638 thumbprint, once operational.
        reason:
          type: string
          description: Why the server is non-operational.
        api_index:
          type: object
          required: [behind]
          properties:
            behind:
              type: integer
              description: Record versions the index has yet to fold in, across every community.
    Challenge:
      type: object
      required: [nonce, expires_in]
      properties:
        nonce:
          type: string
        expires_in:
          type: integer
          description: Seconds until the nonce expires.
    ChallengeIn:
      type: object
      required: [handle]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
    AdminSessionRequest:
      type: object
      required: [nonce, signature]
      properties:
        nonce:
          type: string
        signature:
          type: string
          description: The nonce's Ed25519 signature, base64url.
    SessionRequest:
      type: object
      required: [handle, nonce, signature]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        nonce:
          type: string
        signature:
          type: string
          description: The nonce's Ed25519 signature, base64url.
    Session:
      type: object
      required: [key, expires, expires_in, kid]
      properties:
        key:
          type: string
          description: 'The session key, `sak_…`. Send it as `Authorization: Bearer sak_…`.'
        expires:
          type: string
          format: date-time
        expires_in:
          type: number
          description: Seconds the session lasts.
        kid:
          type: string
          description: The thumbprint of the public key whose private key file obtained it.
    PublicJwk:
      type: object
      description: An Ed25519 public key as a JWK (`kty` OKP, `crv` Ed25519, `x`).
      required: [kty, crv, x]
      properties:
        kty:
          type: string
          enum: [OKP]
        crv:
          type: string
          enum: [Ed25519]
        x:
          type: string
    RegisterIn:
      type: object
      required: [handle, public_jwk, nonce, signature]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        public_jwk:
          $ref: '#/components/schemas/PublicJwk'
        nonce:
          type: string
        signature:
          type: string
          description: The nonce's signature by the key being registered, its proof of possession.
        invite:
          type: string
          nullable: true
          description: The Member's invite, `sdi_…`.
    Registered:
      type: object
      required: [handle, kid, community]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        kid:
          type: string
        community:
          $ref: '#/components/schemas/CommunityName'
    RotateIn:
      type: object
      required: [public_jwk, nonce, signature]
      properties:
        public_jwk:
          $ref: '#/components/schemas/PublicJwk'
        nonce:
          type: string
        signature:
          type: string
          description: The nonce's signature by the new key.
    Rotated:
      type: object
      required: [handle, kid]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        kid:
          type: string
    CommunityIn:
      type: object
      required: [name]
      properties:
        name:
          type: string
    CommunityCreated:
      type: object
      required: [name, created]
      properties:
        name:
          type: string
        created:
          type: boolean
          description: False when exactly this name already existed.
    CommunityList:
      type: object
      required: [communities]
      properties:
        communities:
          type: array
          items:
            type: object
            required: [name, created]
            properties:
              name:
                $ref: '#/components/schemas/CommunityName'
              created:
                type: string
                format: date-time
    ImportResult:
      type: object
      required: [imported, handles]
      properties:
        imported:
          $ref: '#/components/schemas/CommunityName'
        handles:
          type: array
          items:
            type: object
            required: [handle, result]
            properties:
              handle:
                $ref: '#/components/schemas/Handle'
              result:
                type: string
      additionalProperties:
        type: integer
        description: How many rows of each table were imported.
    PortIn:
      type: object
      required: [ndex_url, credentials]
      properties:
        ndex_url:
          type: string
          pattern: '^https?://'
        credentials:
          type: object
          required: [username, password]
          properties:
            username:
              type: string
            password:
              type: string
        page_size:
          type: integer
          minimum: 1
          maximum: 10000
          default: 100
    Port:
      type: object
      required: [id, community, requested_by, source, state, started]
      properties:
        id:
          type: string
          format: uuid
        community:
          $ref: '#/components/schemas/CommunityName'
        requested_by:
          type: string
        source:
          type: string
        state:
          type: string
          enum: [running, ok, failed]
        result:
          type: object
          nullable: true
        started:
          type: string
          format: date-time
        finished:
          type: string
          nullable: true
          format: date-time
    RosterEntry:
      type: object
      required: [handle, registered, invite_expires]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        registered:
          type: boolean
        invite_expires:
          type: string
          nullable: true
          format: date-time
    Roster:
      type: object
      required: [community, roster]
      properties:
        community:
          $ref: '#/components/schemas/CommunityName'
        roster:
          type: array
          items:
            $ref: '#/components/schemas/RosterEntry'
    RosterChange:
      type: object
      required: [community, handle]
      properties:
        community:
          $ref: '#/components/schemas/CommunityName'
        handle:
          $ref: '#/components/schemas/Handle'
        added:
          type: boolean
        removed:
          type: boolean
        api_keys_revoked:
          type: integer
    InviteIn:
      type: object
      required: [handle]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        hours:
          type: integer
          minimum: 1
          maximum: 8784
    Invite:
      type: object
      required: [community, handle, invite, expires]
      properties:
        community:
          $ref: '#/components/schemas/CommunityName'
        handle:
          $ref: '#/components/schemas/Handle'
        invite:
          type: string
          description: The invite, `sdi_…`. Hand it over out of band.
        expires:
          type: string
          format: date-time
    InviteList:
      type: object
      required: [community, invites]
      properties:
        community:
          $ref: '#/components/schemas/CommunityName'
        invites:
          type: array
          items:
            type: object
            required: [handle, invite, expires]
            properties:
              handle:
                $ref: '#/components/schemas/Handle'
              invite:
                type: string
              expires:
                type: string
                format: date-time
    RebindIn:
      type: object
      properties:
        hours:
          type: integer
          minimum: 1
          maximum: 8784
    Rebound:
      allOf:
        - $ref: '#/components/schemas/Invite'
        - type: object
          required: [retired_keys]
          properties:
            retired_keys:
              type: integer
    SuspectIn:
      type: object
      required: [at]
      properties:
        at:
          type: string
          format: date-time
    SuspectAfter:
      type: object
      required: [community, handle, suspect_after]
      properties:
        community:
          $ref: '#/components/schemas/CommunityName'
        handle:
          $ref: '#/components/schemas/Handle'
        suspect_after:
          type: string
          format: date-time
    IssuedKeyIn:
      type: object
      required: [label]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        role:
          type: string
          enum: [member, non-member]
          description: |
            By default a member issued key bound to the Member, and for the admin an
            non-member issued key.
        expires_days:
          type: integer
          minimum: 1
          maximum: 366
    IssuedKey:
      type: object
      required: [id, community, role, handle, label, key, created, created_by]
      properties:
        id:
          type: string
          format: uuid
        community:
          $ref: '#/components/schemas/CommunityName'
        role:
          type: string
          enum: [member, non-member]
        handle:
          type: string
          nullable: true
          description: The Member a `member` key acts as; null for a `non-member` key.
        label:
          type: string
        key:
          type: string
          nullable: true
          description: The key, for its owner; null for anyone else, and once revoked.
        created:
          type: string
          format: date-time
        created_by:
          type: string
        expires:
          type: string
          nullable: true
          format: date-time
        revoked:
          type: string
          nullable: true
          format: date-time
        revoked_by:
          type: string
          nullable: true
        last_used:
          type: string
          nullable: true
          format: date-time
    IssuedKeyPage:
      type: object
      required: [community, items, next]
      properties:
        community:
          $ref: '#/components/schemas/CommunityName'
        items:
          type: array
          items:
            $ref: '#/components/schemas/IssuedKey'
        next:
          type: string
          nullable: true
          maxLength: 256
          pattern: '^[A-Za-z0-9_-]+$'
    CollectionIn:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
    Collection:
      type: object
      required: [community, name, owner, public]
      properties:
        community:
          $ref: '#/components/schemas/CommunityName'
        name:
          type: string
        owner:
          type: string
        public:
          type: boolean
    CollectionList:
      type: object
      required: [collections]
      properties:
        collections:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Collection'
              - type: object
                required: [access]
                properties:
                  access:
                    type: array
                    description: What the caller may do in the collection.
                    items:
                      type: string
                      enum: [read, write, manage]
    GrantIn:
      type: object
      required: [perm]
      description: Names a roster Member by `handle`, or a non-member issued key by `api_key_id`.
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        api_key_id:
          type: string
          format: uuid
        perm:
          type: string
          enum: [read, write]
        granted:
          type: boolean
          default: true
    GrantChange:
      type: object
      required: [community, collection, handle, api_key_id, perm, granted]
      properties:
        community:
          $ref: '#/components/schemas/CommunityName'
        collection:
          type: string
        handle:
          type: string
          nullable: true
        api_key_id:
          type: string
          nullable: true
          format: uuid
        perm:
          type: string
          enum: [read, write]
        granted:
          type: boolean
    PublicIn:
      type: object
      required: [public]
      properties:
        public:
          type: boolean
    PublicChange:
      type: object
      required: [community, collection, public]
      properties:
        community:
          $ref: '#/components/schemas/CommunityName'
        collection:
          type: string
        public:
          type: boolean
    FileVersion:
      type: object
      description: One version of a file, its metadata without its content.
      required:
        - citation
        - file_id
        - name
        - community
        - collection
        - version
        - sha256
        - size
        - created
        - seq
        - created_by
        - deleted
        - file_deleted
        - purged
        - suspect
        - integrity
        - metadata
      properties:
        citation:
          type: string
          description: '`symposium-data:<file id>@v<n>`.'
        file_id:
          type: string
          format: uuid
        name:
          type: string
        community:
          $ref: '#/components/schemas/CommunityName'
        collection:
          type: string
        version:
          type: integer
        prev:
          type: integer
          nullable: true
        next:
          type: integer
          nullable: true
          description: The next version of the file; null for the newest.
        latest:
          type: integer
          nullable: true
          description: The newest version that isn't a tombstone.
        sha256:
          type: string
        size:
          type: integer
        content_type:
          type: string
          nullable: true
        created:
          type: string
          format: date-time
        seq:
          type: integer
        created_by:
          type: string
        key_id:
          type: string
          nullable: true
        deleted:
          type: boolean
        file_deleted:
          type: boolean
        reason:
          type: string
          nullable: true
        purged:
          type: boolean
        suspect:
          type: boolean
        integrity:
          type: string
          enum: [ok, mismatch]
        metadata:
          type: object
          additionalProperties: true
    FileVersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/FileVersion'
    FileVersionItems:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileVersion'
    ChangesPage:
      type: object
      required: [items, next_since, more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileVersion'
        next_since:
          type: integer
          description: The `since` of the next page.
        more:
          type: boolean
          description: False on the last page.
    QueryIn:
      type: object
      required: [contains]
      properties:
        contains:
          type: object
          additionalProperties: true
        since:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
    Purged:
      type: object
      required: [purged, bytes_freed]
      properties:
        purged:
          type: string
          description: The purged version's citation.
        bytes_freed:
          type: boolean
        note:
          type: string
    PromoteIn:
      type: object
      required: [collection]
      properties:
        collection:
          type: string
        name:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        stamp_json_pointer:
          type: string
          nullable: true
    Verification:
      type: object
      required: [ok, exists, reason]
      properties:
        ok:
          type: boolean
        exists:
          type: boolean
        reason:
          type: string
          nullable: true
        citation:
          type: string
        sha256:
          type: string
        created:
          type: string
          format: date-time
        deleted:
          type: boolean
        purged:
          type: boolean
