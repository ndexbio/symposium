name: ci

on:
  push:
    branches: [data-store]
  pull_request:
    branches: [data-store]

jobs:
  test:
    # Linux runs the whole gate, the data server's suites and their one image build included;
    # Windows runs the skill's runtime and session suites, which need no container
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, docker: true}
          - {os: windows-latest, docker: false}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: make test DOCKER=${{ matrix.docker }}
        shell: bash
      # the API contract (api/openapi.yaml) must stay valid OpenAPI; the linter needs node,
      # which only this one job uses
      - if: matrix.docker
        run: npx --yes @redocly/cli@2.59.0 lint api/openapi.yaml
