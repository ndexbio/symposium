          format: uri
        position:
          $ref: '#/components/schemas/Position'
        counts:
          type: object
          required: [artifacts, by_type, by_member, findings]
          properties:
            artifacts:
              type: integer
            by_type:
              type: object
              additionalProperties:
                type: integer
            by_member:
              type: object
              additionalProperties:
                type: integer
            findings:
              type: object
              description: Findings as the gate saw each Artifact at its acceptance, by level.
              additionalProperties:
                type: integer
        members:
          type: integer
          description: The community's members, removed ones excluded.
        first_created:
          type: string
          nullable: true
