      properties:
        community:
          type: string
          nullable: true
          description: The invitee's home; null for a server-level user.
        handle:
          $ref: '#/components/schemas/Handle'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AssignedRole'
        invite:
          type: string
          description: The invite, `sdi_…`. Hand it over out of band.
        expires:
          type: string
          format: date-time
        data-server-url:
          type: string
          nullable: true
          description: The server's public URL, for the invite file.
    InviteList:
      type: object
      required: [community, invites]
      properties:
        community:
          type: string
          nullable: true
        invites:
          type: array
          items:
            $ref: '#/components/schemas/Invite'
    RebindIn:
      type: object
      properties:
        hours:
          type: integer
          minimum: 1
          maximum: 8784
    Rebound:
      allOf:
        - $ref: '#/components/schemas/Invite'
        - type: object
          required: [retired_keys]
          properties:
            retired_keys:
              type: integer
    SuspectIn:
      type: object
      required: [at]
      properties:
        at:
          type: string
          format: date-time
    IssuedKeyIn:
      type: object
      required: [label, roles]
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 200
        non_member:
          type: boolean
          default: false
          description: |
            A non-member key is its own principal; by default a member key, which acts as its
            issuer.
        roles:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/RoleIn'
        expires_days:
          type: integer
          minimum: 1
          maximum: 366
    IssuedKey:
      type: object
      required: [id, community, member_key, handle, label, key, roles, created, created_by]
      properties:
        id:
          type: string
          format: uuid
        community:
          $ref: '#/components/schemas/CommunityName'
        member_key:
          type: boolean
          description: True for a key that acts as its issuer; false for a non-member key.
        handle:
          type: string
          nullable: true
          description: The user a member key acts as; null for a non-member key.
        label:
          type: string
        key:
          type: string
          nullable: true
          description: The key, for its issuer; null for anyone else.
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AssignedRole'
        created:
          type: string
          format: date-time
        created_by:
          type: string
        expires:
          type: string
          nullable: true
          format: date-time
        last_used:
          type: string
          nullable: true
          format: date-time
    IssuedKeyPage:
      type: object
      required: [community, items, next]
      properties:
        community:
          $ref: '#/components/schemas/CommunityName'
        items:
          type: array
          items:
            $ref: '#/components/schemas/IssuedKey'
        next:
          type: string
          nullable: true
          maxLength: 256
          pattern: '^[A-Za-z0-9_-]+$'
    CollectionIn:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]{0,63}$'
    Collection:
      type: object
      required: [community, name, owner, public]
      properties:
        community:
          $ref: '#/components/schemas/CommunityName'
        name:
          type: string
        owner:
          type: string
        public:
          type: boolean
    CollectionList:
      type: object
      required: [collections]
      properties:
        collections:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Collection'
              - type: object
                required: [access]
                properties:
                  access:
                    type: array
                    description: What the caller may do in the collection.
                    items:
                      type: string
                      enum: [read, write, manage]
    PublicIn:
      type: object
      required: [public]
      properties:
        public:
          type: boolean
    PublicChange:
      type: object
      required: [community, collection, public]
      properties:
        community:
          $ref: '#/components/schemas/CommunityName'
        collection:
          type: string
        public:
          type: boolean
    FileVersion:
      type: object
      description: One version of a file, its metadata without its content.
      required:
        - citation
        - file_id
        - name
        - community
        - collection
        - version
        - sha256
        - size
        - created
        - seq
        - created_by
        - deleted
        - file_deleted
        - purged
        - suspect
        - integrity
        - metadata
      properties:
        citation:
          type: string
          description: '`symposium-data:<file id>@v<n>`.'
        file_id:
          type: string
          format: uuid
        name:
          type: string
        community:
          $ref: '#/components/schemas/CommunityName'
        collection:
          type: string
        version:
          type: integer
        prev:
          type: integer
          nullable: true
        next:
          type: integer
          nullable: true
          description: The next version of the file; null for the newest.
        latest:
          type: integer
          nullable: true
          description: The newest version that isn't a tombstone.
        sha256:
          type: string
        size:
          type: integer
        content_type:
          type: string
          nullable: true
        created:
          type: string
          format: date-time
        seq:
          type: integer
        created_by:
          type: string
        key_id:
          type: string
          nullable: true
        deleted:
          type: boolean
        file_deleted:
          type: boolean
        reason:
          type: string
          nullable: true
        purged:
          type: boolean
        suspect:
          type: boolean
        integrity:
          type: string
          enum: [ok, mismatch]
        metadata:
          type: object
          additionalProperties: true
    FileVersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: '#/components/schemas/FileVersion'
    FileVersionItems:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileVersion'
    ChangesPage:
      type: object
      required: [items, next_since, more]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FileVersion'
        next_since:
          type: integer
          description: The `since` of the next page.
        more:
          type: boolean
          description: False on the last page.
    QueryIn:
      type: object
      required: [contains]
      properties:
        contains:
          type: object
          additionalProperties: true
        since:
          type: integer
          minimum: 0
          default: 0
        limit:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
    Purged:
      type: object
      required: [purged, bytes_freed]
      properties:
        purged:
          type: string
          description: The purged version's citation.
        bytes_freed:
          type: boolean
        note:
          type: string
    PromoteIn:
      type: object
      required: [collection]
      properties:
        collection:
          type: string
        name:
          type: string
          nullable: true
        metadata:
          type: object
          nullable: true
          additionalProperties: true
        stamp_json_pointer:
          type: string
          nullable: true
    Verification:
      type: object
      required: [ok, exists, reason]
      properties:
        ok:
          type: boolean
        exists:
          type: boolean
        reason:
          type: string
          nullable: true
        citation:
          type: string
        sha256:
          type: string
        created:
          type: string
          format: date-time
        deleted:
          type: boolean
        purged:
          type: boolean

    RoleIn:
      type: object
      required: [role]
      properties:
        role:
          type: string
        collections:
          type: array
          nullable: true
          description: |
            For community-member and community-observer only, and required there: `["*"]`,
            `[]`, or collection names.
          items:
            type: string
    AssignedRole:
      type: object
      required: [role, collections]
      properties:
        role:
          type: string
        collections:
          type: array
          nullable: true
          items:
            type: string
    AssignedRoles:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AssignedRole'
    AssignmentIn:
      type: object
      required: [role]
      properties:
        handle:
          $ref: '#/components/schemas/Handle'
        community:
          type: string
          nullable: true
          description: The user's home; a homed caller's own when omitted.
        api_key_id:
          type: string
          nullable: true
          format: uuid
        role:
          type: string
        collections:
          type: array
          nullable: true
          items:
            type: string
    RoleList:
      type: object
      required: [roles]
      properties:
        roles:
          type: array
          items:
            type: object
            required: [role, assignable_to, takes_collections, keys_may_carry, assignable, grants]
            properties:
              role:
                type: string
              assignable_to:
                type: array
                items:
                  type: string
              takes_collections:
                type: boolean
              keys_may_carry:
                type: boolean
              assignable:
                type: boolean
              grants:
                type: object
                description: |
                  Each grant the role compiles to: null when it is not collection-scoped,
                  "assignment" when it takes the assignment's collection value, else a list.
                additionalProperties: true
    UserResource:
      type: object
      required: [id, handle, community, registered, removed, roles]
      properties:
        id:
          type: string
          format: uuid
        handle:
          $ref: '#/components/schemas/Handle'
        community:
          type: string
          nullable: true
          description: The user's home community; null for a server-level user.
        registered:
          type: boolean
        removed:
          type: string
          nullable: true
          format: date-time
        removed_by:
          type: string
          nullable: true
        suspect_after:
          type: string
          nullable: true
          format: date-time
        roles:
          type: array
          items:
            $ref: '#/components/schemas/AssignedRole'
    UserList:
      type: object
      required: [community, users]
      properties:
        community:
          type: string
          nullable: true
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserResource'
    UserContext:
      type: object
      description: |
        The caller as every access check sees it: its community (null for a server-level user),
        and each grant it holds, mapped to null (not collection-scoped) or a list of collection
        values (`*` for every collection).
      required: [principal, community, via_session, grants]
      properties:
        principal:
          type: string
          nullable: true
        community:
          type: string
          nullable: true
        via_session:
          type: boolean
        grants:
          type: object
          description: Each grant -> null, or a list of collection names and `*`.
          additionalProperties: true