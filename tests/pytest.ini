# The top-level test suite: one pytest session, `tests/symposium-data/` then `tests/skills/`
# (the Makefile passes them in that order), sharing one data-server container (suite.py).
# importlib mode: the two port test files, which share a name, and a hyphenated folder never
# clash. The paths reach this folder's helpers, the data server's shared
# harness and port stub, and the CLI's modules.
[pytest]
addopts = --import-mode=importlib
pythonpath = . ../data-server/service/tests ../tools/symposium-data
