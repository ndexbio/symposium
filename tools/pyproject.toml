# Builds one package from this directory: symposium_rules, the rules the gate and the data
# server's API share. The data server takes it as a path dependency
# (data-server/service/pyproject.toml); the skill's tools import it from here as they are.
# Nothing else in tools/ is part of the package.
[project]
name = "symposium-rules"
version = "1.0.0"
description = "The Symposium gate's rules: the validator, the skip rule, the publish checks"
license = "MIT"
requires-python = ">=3.9"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["symposium_rules"]

[tool.uv]
# the data server installs this as a regular package, rebuilt whenever its sources change
cache-keys = [{ file = "pyproject.toml" }, { file = "symposium_rules/**/*.py" }]
