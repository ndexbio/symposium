
[program:seaweed]
; The volume server defaults to port 8080, which is the API's port; it gets its own.
command=weed server -dir=/apps/seaweed/data -ip=127.0.0.1 -ip.bind=127.0.0.1 -volume.port=18080 -master.volumeSizeLimitMB=1024 -volume.max=0 -s3 -s3.port=8333 -s3.config=/apps/seaweed/config/s3.json
user=symposium
priority=20
autorestart=true
startsecs=3
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
