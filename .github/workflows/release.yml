name: release data server image

# Only tags data-server-v<version>, cut from data-store, publish the image:
#   ndexbio/symposium-data:<version> and :latest (multi-arch).
on:
  push:
    tags: ["data-server-v*"]

jobs:
  push-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: make -C data-server push-docker TAG="${GITHUB_REF_NAME#data-server-v}"
